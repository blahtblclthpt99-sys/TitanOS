name: TitanOS Jobs Android Internal Build

# UNSIGNED validation only; never publishes to Google Play.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/android-release.yml"
      - "android/**"
      - "src/**"
      - "api/**"
      - "public/**"
      - "index.html"
      - "capacitor.config.*"
      - "vite.config.*"
      - "package.json"
      - "package-lock.json"
      - "scripts/career-first.test.mjs"
      - "scripts/verify-jobs-backend.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titanos-jobs-internal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  internal-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_CAPACITOR_BUILD: "true"
      # Staging jobs schema has ZERO prior accounts; never promote as production.
      VITE_SUPABASE_URL: "https://wbymywwrpbljfbsemung.supabase.co"
      VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_RzUfaeZN5WU58Ma-a5iJNw_fPEC25cI"
      VITE_API_BASE_URL: "https://titanos-web.vercel.app"
      VITE_TITANOS_PUBLIC_ORIGIN: "https://titanos-web.vercel.app"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4

      - name: Reject wrong authentication backend
        run: node scripts/verify-jobs-backend.mjs --internal

      - name: Install locked dependencies
        run: npm ci

      - name: Verify jobs, login and permissions
        run: |
          node --test scripts/career-first.test.mjs
          node --test scripts/free-job-access.test.mjs
          npm run test:auth
          npm run test:hire

      - name: Lint, typecheck and compile
        run: |
          npm audit --audit-level=high
          npm run lint
          npm run typecheck
          npm run build

      - name: Verify Android version, identity and OAuth
        shell: bash
        run: |
          grep -q 'applicationId "com.titanos.myapp"' android/app/build.gradle
          grep -q 'versionCode 41' android/app/build.gradle
          grep -q 'versionName "2.0.7"' android/app/build.gradle
          grep -q '"appId": "com.titanos.myapp"' capacitor.config.json
          grep -q 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:scheme="com.titanos.myapp" android:host="auth" android:pathPrefix="/callback"' android/app/src/main/AndroidManifest.xml
          grep -q 'parsed.protocol === "com.titanos.myapp:"' src/lib/capacitor-auth.js
          test ! -f android/keystore.properties
          test ! -f android/titanos-upload.jks

      - name: Sync Android app
        run: npx cap sync android

      - name: Build and lint unsigned Android candidate
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean lintRelease bundleRelease

      - name: Verify AAB integrity and label internal-only status
        shell: bash
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          unzip -t "$AAB" >/dev/null
          sha256sum "$AAB" | tee TitanOS-Jobs-2.0.7-code41-SHA256.txt
          {
            echo "CANDIDATE_ONLY=TRUE"
            echo "SIGNED=FALSE"
            echo "PRODUCTION_AUTH_VERIFIED=FALSE"
            echo "PLAY_ACCEPTANCE_VERIFIED=FALSE"
            echo "VERSION_NAME=2.0.7"
            echo "VERSION_CODE=41"
            echo "APPLICATION_ID=com.titanos.myapp"
            echo "SOURCE_COMMIT=$GITHUB_SHA"
          } > TitanOS-Jobs-2.0.7-code41-BUILD-INFO.txt

      - name: Upload unsigned internal candidate
        uses: actions/upload-artifact@v4
        with:
          name: TitanOS-Jobs-2.0.7-code41-UNSIGNED-INTERNAL
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            TitanOS-Jobs-2.0.7-code41-SHA256.txt
            TitanOS-Jobs-2.0.7-code41-BUILD-INFO.txt
          retention-days: 14
          if-no-files-found: error
