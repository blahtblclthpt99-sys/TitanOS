name: Build AnatomyLens APK

on:
  push:
    branches:
      - anatomylens-apk-build
    paths:
      - "anatomylens-android/**"
      - ".github/workflows/anatomylens-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: anatomylens-android
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: cp anatomylens-android/app/build/outputs/apk/debug/app-debug.apk AnatomyLens-V14-Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnatomyLens-V14-Android
          path: AnatomyLens-V14-Android.apk
          if-no-files-found: error
          retention-days: 7
