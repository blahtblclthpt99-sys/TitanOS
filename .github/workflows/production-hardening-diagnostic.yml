name: TitanOS Production Hardening Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - "infra/cloudflare-full-app-candidate"

permissions:
  contents: read

jobs:
  hardening-section:
    name: ${{ matrix.section }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        section:
          - Sentry wiring
          - Health readiness
          - Stripe money path guards
          - Marketplace free + payment fees
          - Security headers & rate limits
          - Authentication trust boundary
          - Critical migrations on disk
          - Critical workflow surfaces (structural)
          - Scale / concurrent-session hardening
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run hardening section
        run: node --import ./scripts/node-test-setup.mjs --test-force-exit --test --test-name-pattern="${{ matrix.section }}" scripts/production-hardening.test.mjs
