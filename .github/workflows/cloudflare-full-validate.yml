name: TitanOS Cloudflare Full App Validate

on:
  pull_request:
    branches: [main]
    paths:
      - "cloudflare/**"
      - "src/**"
      - "api/**"
      - "public/**"
      - "index.html"
      - "vite.config.js"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-full-validate.yml"
      - ".github/workflows/cloudflare-full-preview.yml"
      - ".github/workflows/android-release.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - "infra/cloudflare-full-titanos-migration"
    paths:
      - "cloudflare/**"
      - "src/**"
      - "api/**"
      - "public/**"
      - "index.html"
      - "vite.config.js"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-full-validate.yml"
      - ".github/workflows/cloudflare-full-preview.yml"
      - ".github/workflows/android-release.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: titanos-cloudflare-full-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prove canonical TitanOS product surface is intact
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "src/components/ai/InvisibleInterface.jsx"
            "src/components/shared/TitanSupportButton.jsx"
            "src/components/driver/DriverShiftPanel.jsx"
            "src/api/apiClient.js"
            "api/functions/titanAI.js"
            "api/functions/titanAILive.js"
            "api/functions/supportAI.js"
            "api/functions/stripeWebhook.js"
            "api/functions/health.js"
            "api/functions/auth/me.js"
            ".github/workflows/android-release.yml"
            "cloudflare/node-handler-adapter.js"
            "cloudflare/api-router.js"
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "Canonical TitanOS surface missing: $path"; exit 1; }
          done

      - name: Install dependencies exactly from lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Authentication regression suite
        run: npm run test:auth

      - name: API regression suite
        run: npm run test:api

      - name: Payment regression suite
        run: npm run test:payments

      - name: Security regression suite
        run: npm run test:security

      - name: TitanAI regression suite
        run: npm run test:ai

      - name: Driver Hub regression suite
        run: npm run test:driver

      - name: GPS regression suite
        run: npm run test:gps

      - name: Offline/PWA regression suite
        run: npm run test:offline

      - name: Build canonical production assets
        run: npm run build

      - name: Validate Cloudflare Worker bundle without deployment
        run: npx --yes wrangler@4.127.0 deploy --dry-run --outdir .wrangler-full-dry-run

      - name: Enforce staged native migration boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f cloudflare/worker.js
          test -f cloudflare/api-router.js
          test -f cloudflare/node-handler-adapter.js
          grep -q 'migration_mode: "full-app-native-staged"' cloudflare/worker.js
          grep -q 'api_runtime: "cloudflare-workers-native"' cloudflare/worker.js
          grep -q 'unmigrated_api_policy: "fail-closed"' cloudflare/worker.js
          grep -q 'production_cutover_ready: false' cloudflare/worker.js
          grep -q '"/api/functions/health"' cloudflare/api-router.js
          grep -q '"/api/functions/auth/me"' cloudflare/api-router.js
          grep -q 'not_found_handling.*single-page-application' wrangler.jsonc
          grep -q '"/\*"' wrangler.jsonc
          grep -q '"!/assets/\*"' wrangler.jsonc

          if grep -R -n -E 'LEGACY_API_ORIGIN|\.vercel\.app' cloudflare wrangler.jsonc .github/workflows/cloudflare-full-preview.yml; then
            echo "Cloudflare runtime still depends on a Vercel API origin"
            exit 1
          fi
          if grep -n -E '"workers_dev"[[:space:]]*:[[:space:]]*false|"routes?"[[:space:]]*:|"custom_domains?"[[:space:]]*:' wrangler.jsonc; then
            echo "Production routing must not be configured in Wrangler config"
            exit 1
          fi
