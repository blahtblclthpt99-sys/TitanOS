name: TitanOS Upload Certified Cloudflare Version

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titanos-cloudflare-production-version-upload
  cancel-in-progress: false

jobs:
  upload-version:
    if: github.ref == 'refs/heads/infra/cloudflare-full-app-candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: https://xcfjpxcmokdfwkarwomy.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_tVLR58SR1KgOYqDbLaqNJA_r9ML0nLI
      VITE_TITANOS_PUBLIC_ORIGIN: https://app.titanfieldos.com
      VITE_API_BASE_URL: https://app.titanfieldos.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify safe upload-only workflow
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test "$VITE_TITANOS_PUBLIC_ORIGIN" = "https://app.titanfieldos.com" || exit 1
          test "$VITE_API_BASE_URL" = "https://app.titanfieldos.com" || exit 1
          test "$VITE_SUPABASE_URL" = "https://xcfjpxcmokdfwkarwomy.supabase.co" || exit 1
          if grep -n -E 'wrangler@[^ ]+ (deploy([[:space:]]|$)|versions deploy([[:space:]]|$)|secret (put|bulk|delete)([[:space:]]|$)|triggers deploy([[:space:]]|$))' .github/workflows/cloudflare-production-version-upload.yml; then
            echo "Upload-only workflow contains a traffic deployment or secret mutation command"
            exit 1
          fi

      - name: Install exact dependencies
        run: npm ci

      - name: Re-certify preservation and runtime contracts
        run: |
          node --test scripts/cloudflare-full-app-preservation.test.mjs
          node --test scripts/cloudflare-api-coverage.test.mjs
          node scripts/cloudflare-runtime-env-audit.mjs

      - name: Build production browser application
        run: npm run build

      - name: Validate Cloudflare bundle without mutation
        run: npx --yes wrangler@4.102.0 deploy --dry-run --outdir .wrangler-production-upload-dry-run

      - name: Upload immutable Worker version without routing traffic
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.102.0 versions upload \
            --name titanos \
            --tag "git-${GITHUB_SHA}" \
            --message "TitanOS certified candidate ${GITHUB_SHA}"

      - name: Explain next gate
        run: |
          echo "Immutable TitanOS Worker version uploaded."
          echo "No production traffic was deployed by this workflow."
          echo "Next: verify version/bindings, then attach domain and use controlled production promotion only after external gates pass."
