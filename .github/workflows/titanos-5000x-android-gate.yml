# rerun: platform-neutral Gradle trust store + remediated npm graph
name: TitanOS 5000X Android parity gate

on:
  push:
    branches:
      - security/titanos-5000x-full-system-audit
    paths:
      - .github/workflows/titanos-5000x-android-gate.yml

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/titanos-5000x-full-system-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Align TitanOS Node runtime with current dependencies
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.engines = { ...(pkg.engines || {}), node: '>=22 <25' };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
      - run: npm ci
      - name: Capacitor sync
        run: npm run cap:sync
      - name: Android release bundle compile
        working-directory: android
        run: gradle bundleRelease --no-daemon
      - name: Verify AAB exists
        run: |
          test -f android/app/build/outputs/bundle/release/app-release.aab
          sha256sum android/app/build/outputs/bundle/release/app-release.aab
      - name: Commit verified Android/runtime changes and remove temporary workflow
        run: |
          rm .github/workflows/titanos-5000x-android-gate.yml
          git config user.name "TitanOS Release Guardian"
          git config user.email "actions@users.noreply.github.com"
          git add package.json android .github/workflows/titanos-5000x-android-gate.yml
          git diff --cached --check
          git commit -m "build: align Node runtime and verify Android release bundle"
          git push origin HEAD:security/titanos-5000x-full-system-audit
