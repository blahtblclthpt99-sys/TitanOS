name: TitanOS Google Play Release AAB

on:
  push:
    branches:
      - release/titanos-play
    paths:
      - ".github/workflows/android-release.yml"
      - "android/**"
      - "src/**"
      - "api/**"
      - "public/**"
      - "index.html"
      - "capacitor.config.*"
      - "vite.config.*"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches:
      - release/titanos-play
    paths:
      - ".github/workflows/android-release.yml"
      - "android/**"
      - "src/**"
      - "api/**"
      - "public/**"
      - "index.html"
      - "capacitor.config.*"
      - "vite.config.*"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titanos-play-aab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_CAPACITOR_BUILD: "true"
      VITE_SUPABASE_URL: "https://xcfjpxcmokdfwkarwomy.supabase.co"
      VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_tVLR58SR1KgOYqDbLaqNJA_r9ML0nLI"
      VITE_API_BASE_URL: "https://titanos-web.vercel.app"
      VITE_TITANOS_PUBLIC_ORIGIN: "https://titanos-web.vercel.app"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Install and verify TitanOS
        run: |
          npm ci
          npm audit --audit-level=high
          npm run lint
          npm run typecheck
          npm run gate:ship

      - name: Verify Android release contract
        shell: bash
        run: |
          grep -q 'applicationId "com.titanos.myapp"' android/app/build.gradle
          grep -q 'versionCode 38' android/app/build.gradle
          grep -q 'versionName "2.0.5"' android/app/build.gradle
          grep -q 'targetSdkVersion = 36' android/variables.gradle
          grep -q 'compileSdkVersion = 36' android/variables.gradle
          grep -q '"appId": "com.titanos.myapp"' capacitor.config.json
          grep -q 'minifyEnabled true' android/app/build.gradle
          grep -q 'shrinkResources true' android/app/build.gradle
          grep -q 'proguard-android-optimize.txt' android/app/build.gradle
          grep -q 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:dataExtractionRules="@xml/data_extraction_rules"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:scheme="com.titanos.myapp" android:host="auth" android:pathPrefix="/callback"' android/app/src/main/AndroidManifest.xml
          grep -q 'registerPlugin(TitanBillingPlugin.class)' android/app/src/main/java/com/titanos/myapp/MainActivity.java
          grep -q 'connectionInFlight' android/app/src/main/java/com/titanos/myapp/TitanBillingPlugin.java
          grep -q 'handleOnResume' android/app/src/main/java/com/titanos/myapp/TitanBillingPlugin.java
          grep -q 'queryPurchasesAsync' android/app/src/main/java/com/titanos/myapp/TitanBillingPlugin.java
          grep -q '<external-files-path' android/app/src/main/res/xml/file_paths.xml
          ! grep -q '<external-path' android/app/src/main/res/xml/file_paths.xml

      - name: Restore Play upload key when configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/titanos-upload.jks
            cat > android/keystore.properties <<EOF
          storeFile=titanos-upload.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
            echo "PLAY_SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"
          else
            echo "PLAY_SIGNING_CONFIGURED=false" >> "$GITHUB_ENV"
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Lint and build release bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean lintRelease bundleRelease

      - name: Verify AAB structure and signing state
        shell: bash
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          unzip -t "$AAB" >/dev/null
          sha256sum "$AAB" | tee TitanOS-2.0.5-code38-AAB-SHA256.txt
          if jarsigner -verify "$AAB" >/dev/null 2>&1; then
            AAB_SIGNED=true
          else
            AAB_SIGNED=false
          fi
          {
            echo "VERSION_NAME=2.0.5"
            echo "VERSION_CODE=38"
            echo "APPLICATION_ID=com.titanos.myapp"
            echo "TARGET_SDK=36"
            echo "COMMIT_SHA=$GITHUB_SHA"
            echo "PLAY_SIGNING_CONFIGURED=$PLAY_SIGNING_CONFIGURED"
            echo "AAB_SIGNED=$AAB_SIGNED"
            echo "API_BASE_URL=$VITE_API_BASE_URL"
            echo "SUPABASE_URL=$VITE_SUPABASE_URL"
          } > TitanOS-2.0.5-code38-build-info.txt

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f android/titanos-upload.jks android/keystore.properties

      - name: Upload Android release artifact
        uses: actions/upload-artifact@v4
        with:
          name: TitanOS-2.0.5-code38-AAB
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            TitanOS-2.0.5-code38-AAB-SHA256.txt
            TitanOS-2.0.5-code38-build-info.txt
            android/app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 30
