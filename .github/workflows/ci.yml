# TitanOS CI — build gate for GitHub → Vercel continuous deployment
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit / integration / regression pack
        run: npm test

      - name: Existing-post worker matching regression
        run: node --import ./scripts/node-test-setup.mjs --test-force-exit --test scripts/hire-existing-post-matches.test.mjs

      - name: Free job access contract
        run: node --test scripts/free-job-access.test.mjs

      - name: Google Play billing policy boundary
        run: node --test scripts/play-billing-policy.test.mjs

      - name: Production build
        run: npm run build
        env:
          # Public placeholders so Vite can compile without real secrets
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: public-anon-placeholder-for-ci
          VITE_TITANOS_PUBLIC_ORIGIN: https://titanos-web.vercel.app
          VITE_API_BASE_URL: https://titanos-web.vercel.app

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke (Chromium)
        run: npm run test:e2e
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: public-anon-placeholder-for-ci
          VITE_TITANOS_PUBLIC_ORIGIN: https://titanos-web.vercel.app
          VITE_API_BASE_URL: https://titanos-web.vercel.app
