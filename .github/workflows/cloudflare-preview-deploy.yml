name: TitanOS Cloudflare Preview Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titanos-cloudflare-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/infra/cloudflare-workers-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify required Cloudflare credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Validate Cloudflare bundle before upload
        run: npx --yes wrangler@4.102.0 deploy --dry-run --outdir .wrangler-preview-dry-run

      - name: Deploy isolated Cloudflare preview worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.102.0'
          command: deploy --name titanos-preview

      - name: Smoke-test deployed edge health endpoint
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          RAW_URL="${DEPLOYMENT_URL%% *}"
          if [ -z "$RAW_URL" ]; then
            echo "Cloudflare deployment completed but no deployment URL was emitted."
            exit 1
          fi
          case "$RAW_URL" in
            http://*|https://*) BASE_URL="$RAW_URL" ;;
            *) BASE_URL="https://$RAW_URL" ;;
          esac
          echo "Smoke testing Cloudflare preview edge health"
          curl --fail --silent --show-error --location \
            --retry 4 --retry-delay 3 --retry-all-errors \
            "$BASE_URL/__titanos/edge-health" | tee /tmp/titanos-edge-health.json
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/titanos-edge-health.json','utf8'));if(d.ok!==true||d.runtime!=='cloudflare-workers'||d.api_bridge_configured!==true)process.exit(1);"
