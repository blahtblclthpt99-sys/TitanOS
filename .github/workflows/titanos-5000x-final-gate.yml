name: TitanOS 5000X final release gate

on:
  push:
    branches:
      - security/titanos-5000x-full-system-audit
    paths:
      - .github/workflows/titanos-5000x-final-gate.yml

permissions:
  contents: write

jobs:
  final-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/titanos-5000x-full-system-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Synchronize lockfile metadata with Node 22 runtime declaration
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Reject high or critical dependency advisories
        run: npm audit --audit-level=high
      - name: Validate Android runtime hardening
        run: |
          node -e "const p=require('./package.json'); if(!String(p.engines?.node||'').includes('>=22')) process.exit(1)"
          ! grep -R "Windows-ROOT" android/gradle.properties
          test -f android/gradle/wrapper/gradle-wrapper.jar
      - name: Full TitanOS ship gate
        run: npm run gate:ship
      - name: Commit only verified lockfile metadata and remove temporary workflow
        run: |
          rm .github/workflows/titanos-5000x-final-gate.yml
          git config user.name "TitanOS Release Guardian"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json package.json .github/workflows/titanos-5000x-final-gate.yml
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "release: verify final TitanOS 5000X dependency and ship gates"
            git push origin HEAD:security/titanos-5000x-full-system-audit
          fi
