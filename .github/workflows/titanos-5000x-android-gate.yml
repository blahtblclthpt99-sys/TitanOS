name: TitanOS 5000X Android parity gate

on:
  push:
    branches:
      - security/titanos-5000x-full-system-audit
    paths:
      - .github/workflows/titanos-5000x-android-gate.yml

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/titanos-5000x-full-system-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Capacitor sync
        run: npm run cap:sync
      - name: Android release bundle compile
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
      - name: Verify AAB exists
        run: |
          test -f android/app/build/outputs/bundle/release/app-release.aab
          sha256sum android/app/build/outputs/bundle/release/app-release.aab
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/titanos-5000x-android-gate.yml
          git config user.name "TitanOS Release Guardian"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ci: verify TitanOS 5000X Android release bundle"
          git push origin HEAD:security/titanos-5000x-full-system-audit
