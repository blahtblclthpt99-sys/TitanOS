name: Full System Certification

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: full-system-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-browser:
    name: Cross-browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium, Firefox, and WebKit
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run desktop/mobile cross-browser smoke
        run: npm run test:e2e:browsers
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: e2e-placeholder-anon-key
          VITE_TITANOS_PUBLIC_ORIGIN: https://titanos-web.vercel.app
          VITE_API_BASE_URL: https://titanos-web.vercel.app

  android-compile:
    name: Android native compile
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: public-anon-placeholder-for-ci
          VITE_TITANOS_PUBLIC_ORIGIN: https://titanos-web.vercel.app
          VITE_API_BASE_URL: https://titanos-web.vercel.app

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Compile debug APK and unsigned release AAB
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug bundleRelease
