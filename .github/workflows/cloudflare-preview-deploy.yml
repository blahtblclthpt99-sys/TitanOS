name: TitanOS Cloudflare Preview Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - "infra/cloudflare-workers-migration"
    paths:
      - "cloudflare/preview-trigger.txt"

permissions:
  contents: read

concurrency:
  group: titanos-cloudflare-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/infra/cloudflare-workers-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify required deployment credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          test -n "$STRIPE_SECRET_KEY" || { echo "Missing STRIPE_SECRET_KEY repository secret"; exit 1; }
          test -n "$STRIPE_WEBHOOK_SECRET" || { echo "Missing STRIPE_WEBHOOK_SECRET repository secret"; exit 1; }
          test -n "$SUPABASE_URL" || { echo "Missing SUPABASE_URL repository secret"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "Missing SUPABASE_SERVICE_ROLE_KEY repository secret"; exit 1; }

      - name: Identify bound Stripe account and validate Supabase service role
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -u "$STRIPE_SECRET_KEY:" \
            https://api.stripe.com/v1/account > /tmp/stripe-account.json
          node - <<'NODE'
          const fs = require('fs');
          const account = JSON.parse(fs.readFileSync('/tmp/stripe-account.json', 'utf8'));
          if (!account?.id || !String(account.id).startsWith('acct_')) process.exit(1);
          console.log(`Titan Stripe account: ${account.id}`);
          console.log(`Stripe charges enabled: ${Boolean(account.charges_enabled)}`);
          NODE
          rm -f /tmp/stripe-account.json

          SUPABASE_BASE="${SUPABASE_URL%/}"
          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_BASE/rest/v1/attention_profiles?select=user_id&limit=0" > /tmp/supabase-check.json
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/supabase-check.json','utf8'));if(!Array.isArray(d))process.exit(1);"
          rm -f /tmp/supabase-check.json

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Reject legacy runtime references
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'LEGACY_API_ORIGIN|titanos-web\.vercel\.app' cloudflare wrangler.jsonc; then
            echo "Legacy Vercel runtime reference detected in Cloudflare deployment surface"
            exit 1
          fi

      - name: Validate Cloudflare bundle before upload
        run: npx --yes wrangler@4.102.0 deploy --dry-run --outdir .wrangler-preview-dry-run

      - name: Provision preview Worker payment secrets
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const names = [
            'STRIPE_SECRET_KEY',
            'STRIPE_WEBHOOK_SECRET',
            'SUPABASE_URL',
            'SUPABASE_SERVICE_ROLE_KEY',
          ];
          const payload = Object.fromEntries(names.map((name) => [name, process.env[name]]));
          fs.writeFileSync('/tmp/titanos-preview-secrets.json', JSON.stringify(payload));
          NODE
          npx --yes wrangler@4.102.0 secret bulk /tmp/titanos-preview-secrets.json --name titanos-preview
          rm -f /tmp/titanos-preview-secrets.json

      - name: Deploy isolated Cloudflare preview worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.102.0'
          command: deploy --name titanos-preview

      - name: Smoke-test deployed Cloudflare-native edge runtime
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          RAW_URL="${DEPLOYMENT_URL%% *}"
          if [ -z "$RAW_URL" ]; then
            echo "Cloudflare deployment completed but no deployment URL was emitted."
            exit 1
          fi
          case "$RAW_URL" in
            http://*|https://*) BASE_URL="$RAW_URL" ;;
            *) BASE_URL="https://$RAW_URL" ;;
          esac
          echo "Smoke testing Cloudflare-native preview edge health"
          curl --fail --silent --show-error --location \
            --retry 4 --retry-delay 3 --retry-all-errors \
            "$BASE_URL/__titanos/edge-health" | tee /tmp/titanos-edge-health.json
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/titanos-edge-health.json','utf8'));if(d.ok!==true||d.runtime!=='cloudflare-workers'||d.api_runtime!=='cloudflare-workers'||d.legacy_proxy!==false||d.payment_bindings_configured!==true)process.exit(1);"

      - name: Smoke-test retired API paths fail closed
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          RAW_URL="${DEPLOYMENT_URL%% *}"
          case "$RAW_URL" in
            http://*|https://*) BASE_URL="$RAW_URL" ;;
            *) BASE_URL="https://$RAW_URL" ;;
          esac
          STATUS="$(curl --silent --output /tmp/retired-api.json --write-out '%{http_code}' "$BASE_URL/api/retired-probe")"
          test "$STATUS" = "404" || { cat /tmp/retired-api.json; echo "Retired API path did not fail closed"; exit 1; }
