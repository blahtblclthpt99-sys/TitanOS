name: Apply 2nd Me UX integrity patch
on:
  push:
    branches: [hardening/second-me-ux-integrity]
    paths:
      - scripts/apply-second-me-ux-integrity.mjs
      - .github/workflows/apply-second-me-ux-integrity.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/second-me-ux-integrity
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply source patch
        run: node scripts/apply-second-me-ux-integrity.mjs
      - name: Remove one-time patch machinery
        run: rm scripts/apply-second-me-ux-integrity.mjs .github/workflows/apply-second-me-ux-integrity.yml
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "polish(ai): prevent duplicate actions and retain failed rollback" || exit 0
          git push
