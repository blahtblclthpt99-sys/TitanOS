name: Titan Attention Lockfile Refresh

on:
  push:
    branches:
      - infra/cloudflare-workers-migration
    paths:
      - package.json
      - .github/workflows/attention-lockfile-refresh.yml

permissions:
  contents: write

concurrency:
  group: titan-attention-lockfile-refresh
  cancel-in-progress: false

jobs:
  refresh-lockfile:
    if: github.ref == 'refs/heads/infra/cloudflare-workers-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify root lockfile matches minimal manifest
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const root = lock.packages?.[''];
          if (!root) throw new Error('package-lock.json is missing its root package entry');
          const normalize = (value) => Object.fromEntries(Object.entries(value || {}).sort(([a], [b]) => a.localeCompare(b)));
          const expectedDeps = normalize(pkg.dependencies);
          const expectedDevDeps = normalize(pkg.devDependencies);
          const actualDeps = normalize(root.dependencies);
          const actualDevDeps = normalize(root.devDependencies);
          if (JSON.stringify(actualDeps) !== JSON.stringify(expectedDeps)) {
            console.error('Root lockfile dependencies do not match package.json');
            console.error({ expectedDeps, actualDeps });
            process.exit(1);
          }
          if (JSON.stringify(actualDevDeps) !== JSON.stringify(expectedDevDeps)) {
            console.error('Root lockfile devDependencies do not match package.json');
            console.error({ expectedDevDeps, actualDevDeps });
            process.exit(1);
          }
          const directCount = Object.keys(expectedDeps).length + Object.keys(expectedDevDeps).length;
          if (directCount !== 6) {
            console.error(`Expected exactly 6 direct packages, found ${directCount}`);
            process.exit(1);
          }
          console.log(`Root lockfile matches package.json: ${Object.keys(expectedDeps).length} runtime + ${Object.keys(expectedDevDeps).length} dev = ${directCount} direct packages`);
          NODE
      - name: Verify clean install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Measure installed package surface
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_COUNT="$(npm ls --all --parseable 2>/dev/null | tail -n +2 | wc -l | tr -d ' ')"
          echo "Installed dependency entries: ${PACKAGE_COUNT}"
      - name: Audit production dependency security
        run: npm audit --omit=dev --audit-level=high
      - name: Verify active Attention policies
        run: npm test
      - name: Build production assets
        run: npm run build
      - name: Validate Cloudflare bundle without deploying
        run: npx --yes wrangler@4.102.0 deploy --dry-run --outdir .wrangler-lockfile-cert
      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize minimal Attention lockfile"
          git push origin HEAD:infra/cloudflare-workers-migration
