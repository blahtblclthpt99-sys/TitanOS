name: TitanOS Android Release AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install and verify web application
        run: |
          npm ci
          npm audit --audit-level=high
          npm run lint
          npm run typecheck
          npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Restore Play upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/titanos-upload.jks
          cat > android/keystore.properties <<EOF
          storeFile=titanos-upload.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed release bundle
        working-directory: android
        run: ./gradlew --no-daemon clean bundleRelease

      - name: Verify AAB signature
        run: jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab

      - name: Record SHA-256
        run: sha256sum android/app/build/outputs/bundle/release/app-release.aab | tee TitanOS-release-aab-SHA256.txt

      - name: Upload Play release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TitanOS-2.0.4-code37-PLAY-READY
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            TitanOS-release-aab-SHA256.txt
          if-no-files-found: error
          retention-days: 14
