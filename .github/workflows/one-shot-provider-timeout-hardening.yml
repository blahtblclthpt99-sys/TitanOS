name: TitanOS One-Shot Provider Timeout Hardening

on:
  push:
    branches:
      - recovery/full-app-20260909
    paths:
      - .github/workflows/one-shot-provider-timeout-hardening.yml

permissions:
  contents: write

jobs:
  harden-provider-budgets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/full-app-20260909
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply exact provider-budget patches
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "api/functions/titanAI.js",
              'import { logError } from "../_lib/safeLog.js";\n',
              'import { logError } from "../_lib/safeLog.js";\nimport { fetchWithTimeout, isAbortError } from "../_lib/fetchTimeout.js";\n',
          )

          replace_once(
              "api/functions/titanAI.js",
              '''    const response = await fetch("https://api.openai.com/v1/chat/completions", {
                method: "POST",
                headers: { Authorization: `Bearer ${openAiKey}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                  model: process.env.OPENAI_MODEL || "gpt-4o-mini",
                  temperature: 0.3,
                  max_tokens: 450,
                  messages: [
                    { role: "system", content: buildTitanSystemPrompt({ summary, pageContext, lawMastermind: Boolean(lawMastermind), memoryContext }) },
                    ...recent,
                  ],
                }),
              });
          ''',
              '''    let response;
              try {
                response = await fetchWithTimeout("https://api.openai.com/v1/chat/completions", {
                  method: "POST",
                  headers: { Authorization: `Bearer ${openAiKey}`, "Content-Type": "application/json" },
                  body: JSON.stringify({
                    model: process.env.OPENAI_MODEL || "gpt-4o-mini",
                    temperature: 0.3,
                    max_tokens: 450,
                    messages: [
                      { role: "system", content: buildTitanSystemPrompt({ summary, pageContext, lawMastermind: Boolean(lawMastermind), memoryContext }) },
                      ...recent,
                    ],
                  }),
                }, 20_000);
              } catch (providerError) {
                const timedOut = isAbortError(providerError);
                logError("titanAI:openai_transport", providerError);
                if (!timedOut) {
                  captureApiException(providerError, { tags: { route: "titanAI", stage: "openai_transport" } });
                }
                return res.status(200).json({
                  data: {
                    type: "response",
                    source: "local",
                    dataBasis: "server_snapshot",
                    generalKnowledge: false,
                    interface: buildInvisibleInterface({ question: lastMessage, summary, pageContext }),
                    message: `${timedOut ? "AI provider timed out" : "AI provider is briefly unavailable"}. **YOUR DATA:** **${money(summary.outstandingTotal)}** outstanding, **${money(summary.collectedThisMonth)}** collected this month. You can still use the structured 2nd Me actions.`,
                  },
                });
              }
          ''',
          )

          replace_once(
              "api/functions/createPaymentLink.js",
              'import { assertRateLimitAsync } from "../_lib/rateLimit.js";\n\nfunction resolvePlanFromProfile',
              '''import { assertRateLimitAsync } from "../_lib/rateLimit.js";
          import { fetchWithTimeout, isAbortError } from "../_lib/fetchTimeout.js";
          import { logError } from "../_lib/safeLog.js";

          const STRIPE_CHECKOUT_TIMEOUT_MS = 10_000;

          async function requestStripeCheckout(params, headers) {
            const attempts = headers["Idempotency-Key"] ? 2 : 1;
            let lastError = null;
            for (let attempt = 0; attempt < attempts; attempt += 1) {
              try {
                return await fetchWithTimeout(
                  "https://api.stripe.com/v1/checkout/sessions",
                  {
                    method: "POST",
                    headers,
                    body: params.toString(),
                  },
                  STRIPE_CHECKOUT_TIMEOUT_MS
                );
              } catch (error) {
                lastError = error;
              }
            }
            throw lastError || new Error("Stripe checkout request failed");
          }

          function resolvePlanFromProfile''',
          )

          replace_once(
              "api/functions/createPaymentLink.js",
              '''      const stripeRes = await fetch("https://api.stripe.com/v1/checkout/sessions", {
                method: "POST",
                headers: stripeHeaders,
                body: params.toString(),
              });
              const session = await stripeRes.json();
          ''',
              '''      let stripeRes;
              try {
                stripeRes = await requestStripeCheckout(params, stripeHeaders);
              } catch (providerError) {
                const timedOut = isAbortError(providerError);
                await admin
                  .from("payments")
                  .update({
                    status: "pending",
                    note: `${insertPayload.note} · Stripe checkout result unconfirmed (${timedOut ? "timeout" : "network error"})`,
                    updated_at: new Date().toISOString(),
                  })
                  .eq("id", payment.id);
                logError("createPaymentLink:stripe_transport", providerError);
                return res.status(timedOut ? 504 : 502).json({
                  error: timedOut
                    ? "Checkout provider timed out. The payment remains pending for reconciliation; check Payments before trying again."
                    : "Checkout provider could not be reached. The payment remains pending for reconciliation; check Payments before trying again.",
                  code: timedOut ? "STRIPE_CHECKOUT_TIMEOUT" : "STRIPE_CHECKOUT_NETWORK_ERROR",
                });
              }
              const session = await stripeRes.json();
          ''',
          )

          replace_once(
              "api/functions/createPaymentLink.js",
              '        const { logError } = await import("../_lib/safeLog.js");\n        logError("createPaymentLink:stripe", session.error || session);',
              '        logError("createPaymentLink:stripe", session.error || session);',
          )

          replace_once(
              "api/functions/stripeWebhook.js",
              '''const CHECKOUT_SUCCESS_EVENTS = new Set([
            "checkout.session.completed",
            "checkout.session.async_payment_succeeded",
          ]);
          ''',
              '''const CHECKOUT_SUCCESS_EVENTS = new Set([
            "checkout.session.completed",
            "checkout.session.async_payment_succeeded",
          ]);
          const STRIPE_API_TIMEOUT_MS = 10_000;
          ''',
          )

          replace_once(
              "api/functions/stripeWebhook.js",
              '''    let event;
              try {
                const Stripe = (await import("stripe")).default;
                const stripe = new Stripe(stripeKey);
                event = stripe.webhooks.constructEvent(rawBody, signature, webhookSecret);
              } catch (sigErr) {
          ''',
              '''    let event;
              let stripe;
              try {
                const Stripe = (await import("stripe")).default;
                stripe = new Stripe(stripeKey, {
                  timeout: STRIPE_API_TIMEOUT_MS,
                  maxNetworkRetries: 1,
                });
                event = stripe.webhooks.constructEvent(rawBody, signature, webhookSecret);
              } catch (sigErr) {
          ''',
          )

          replace_once(
              "api/functions/stripeWebhook.js",
              '''      if (CHECKOUT_SUCCESS_EVENTS.has(event.type) && session.mode === "subscription") {
                const stripe = new (await import("stripe")).default(stripeKey);
                const subscriptionId =
          ''',
              '''      if (CHECKOUT_SUCCESS_EVENTS.has(event.type) && session.mode === "subscription") {
                const subscriptionId =
          ''',
          )

          replace_once(
              "scripts/scalability.test.mjs",
              '''  it("vercel sets maxDuration on money and AI routes", () => {
            const cfg = JSON.parse(read("vercel.json"));
            assert.equal(cfg.functions["api/functions/stripeWebhook.js"].maxDuration, 30);
            assert.equal(cfg.functions["api/functions/titanAI.js"].maxDuration, 60);
            assert.equal(cfg.functions["api/functions/createPaymentLink.js"].maxDuration, 30);
          });
          ''',
              '''  it("bounds outbound AI and payment provider work at application level", () => {
            const timeout = read("api/_lib/fetchTimeout.js");
            const ai = read("api/functions/titanAI.js");
            const checkout = read("api/functions/createPaymentLink.js");
            const webhook = read("api/functions/stripeWebhook.js");

            assert.match(timeout, /new AbortController\\(\\)/);
            assert.match(timeout, /setTimeout\\(\\(\\) => controller\\.abort\\(\\)/);
            assert.match(ai, /fetchWithTimeout/);
            assert.match(ai, /20_000/);
            assert.match(checkout, /STRIPE_CHECKOUT_TIMEOUT_MS\\s*=\\s*10_000/);
            assert.match(checkout, /headers\\["Idempotency-Key"\\] \\? 2 : 1/);
            assert.match(webhook, /STRIPE_API_TIMEOUT_MS\\s*=\\s*10_000/);
            assert.match(webhook, /maxNetworkRetries:\\s*1/);
          });
          ''',
          )
          PY

      - name: Validate hardened provider paths
        run: |
          npm ci
          npm audit --audit-level=high
          npm run lint
          npm run typecheck
          npm run test:scalability
          npm run test:api
          npm run test:payments
          npm run test:ai
          git diff --check

      - name: Commit hardening and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-provider-timeout-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/_lib/fetchTimeout.js api/functions/titanAI.js api/functions/createPaymentLink.js api/functions/stripeWebhook.js scripts/scalability.test.mjs
          git commit -m 'fix: enforce provider-neutral request budgets'
          git push origin HEAD:recovery/full-app-20260909
