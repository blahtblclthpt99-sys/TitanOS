name: TitanOS Cloudflare Full App Preview

on:
  workflow_dispatch:
  push:
    branches:
      - "infra/cloudflare-full-titanos-migration"
    paths:
      - "cloudflare/**"
      - "src/**"
      - "api/**"
      - "public/**"
      - "index.html"
      - "vite.config.js"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-full-preview.yml"
      - ".github/workflows/cloudflare-full-validate.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: titanos-cloudflare-full-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/infra/cloudflare-full-titanos-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TITAN_PREVIEW_WORKER_NAME: titanos-full-ci-preview
      TITAN_PREVIEW_URL: https://titanos-full-ci-preview.blahtblclthpt99.workers.dev
      PREVIEW_APP_VERSION: 2.0.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify preview isolation
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test "$TITAN_PREVIEW_WORKER_NAME" = "titanos-full-ci-preview"
          test "$TITAN_PREVIEW_URL" = "https://${TITAN_PREVIEW_WORKER_NAME}.blahtblclthpt99.workers.dev"
          [[ "$TITAN_PREVIEW_URL" == https://*.workers.dev ]]

      - name: Prove canonical TitanOS product surface is intact
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "src/components/ai/InvisibleInterface.jsx"
            "src/components/shared/TitanSupportButton.jsx"
            "src/components/driver/DriverShiftPanel.jsx"
            "src/api/apiClient.js"
            "src/api/apiOrigin.js"
            "api/functions/titanAI.js"
            "api/functions/titanAILive.js"
            "api/functions/titanAICapabilities.js"
            "api/functions/supportAI.js"
            "api/functions/stripeWebhook.js"
            "api/functions/health.js"
            "api/functions/auth/me.js"
            "api/functions/appVersion.js"
            "api/functions/featureFlags.js"
            "api/register.js"
            "scripts/cloudflare-registration.test.mjs"
            "scripts/cloudflare-titanai-capabilities.test.mjs"
            "cloudflare/node-handler-adapter.js"
            "cloudflare/api-router.js"
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "Canonical TitanOS surface missing: $path"; exit 1; }
          done
          test ! -e api/functions/sentryDebug.js || { echo "Retired Sentry debug route was restored"; exit 1; }

      - name: Install dependencies exactly from lockfile
        run: npm ci

      - name: Build canonical production assets
        run: npm run build

      - name: Validate bundle before upload
        run: >-
          npx --yes wrangler@4.127.0 deploy --dry-run
          --outdir .wrangler-full-preview-dry-run
          --name "$TITAN_PREVIEW_WORKER_NAME"
          --var "TITANOS_ENV:preview"
          --var "APP_LATEST_VERSION:$PREVIEW_APP_VERSION"
          --var "APP_MINIMUM_VERSION:$PREVIEW_APP_VERSION"

      - name: Deploy isolated full-app preview
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.127.0 deploy \
            --name "$TITAN_PREVIEW_WORKER_NAME" \
            --var "TITANOS_ENV:preview" \
            --var "APP_LATEST_VERSION:$PREVIEW_APP_VERSION" \
            --var "APP_MINIMUM_VERSION:$PREVIEW_APP_VERSION"

      - name: Verify Cloudflare edge health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-delay 2 --retry-all-errors \
            "$TITAN_PREVIEW_URL/__titanos/edge-health" > /tmp/edge-health.json
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('/tmp/edge-health.json', 'utf8'));
          if (
            d.ok !== true ||
            d.runtime !== 'cloudflare-workers' ||
            d.migration_mode !== 'full-app-native-staged' ||
            d.api_runtime !== 'cloudflare-workers-native' ||
            d.native_api_routes !== 7 ||
            d.unmigrated_api_policy !== 'fail-closed' ||
            d.production_cutover_ready !== false
          ) process.exit(1);
          NODE

      - name: Verify SPA root and deep-route fallback
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-delay 2 --retry-all-errors \
            -D /tmp/root-headers.txt "$TITAN_PREVIEW_URL/" -o /tmp/root.html
          grep -qi '^content-type:.*text/html' /tmp/root-headers.txt
          grep -qi '^x-titanos-edge-runtime:.*cloudflare-workers' /tmp/root-headers.txt
          grep -qi '^strict-transport-security:' /tmp/root-headers.txt
          grep -qi '^content-security-policy:' /tmp/root-headers.txt

          curl --fail --silent --show-error \
            -H 'Sec-Fetch-Mode: navigate' \
            -D /tmp/deep-headers.txt "$TITAN_PREVIEW_URL/driver" -o /tmp/deep.html
          grep -qi '^content-type:.*text/html' /tmp/deep-headers.txt
          grep -qi '<!doctype html' /tmp/deep.html

      - name: Verify canonical health handler runs natively on Workers
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --output /tmp/api-health.json --dump-header /tmp/api-health-headers.txt --write-out '%{http_code}' \
            "$TITAN_PREVIEW_URL/api/functions/health")"
          test "$STATUS" = "200" || { cat /tmp/api-health.json; echo "Native API health returned HTTP $STATUS"; exit 1; }
          grep -qi '^x-titanos-api-runtime:.*cloudflare-workers-native' /tmp/api-health-headers.txt
          grep -qi '^cache-control:.*no-store' /tmp/api-health-headers.txt
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('/tmp/api-health.json', 'utf8'));
          if (d.service !== 'titanos' || !d.checks || !d.readiness) process.exit(1);
          NODE

      - name: Verify app version route uses explicit preview release truth
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --output /tmp/app-version.json --dump-header /tmp/app-version-headers.txt --write-out '%{http_code}' \
            "$TITAN_PREVIEW_URL/api/functions/appVersion")"
          test "$STATUS" = "200" || { cat /tmp/app-version.json; echo "Native appVersion returned HTTP $STATUS"; exit 1; }
          grep -qi '^x-titanos-api-runtime:.*cloudflare-workers-native' /tmp/app-version-headers.txt
          grep -qi '^cache-control:.*no-store' /tmp/app-version-headers.txt
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('/tmp/app-version.json', 'utf8'));
          if (d.latest !== '2.0.0' || d.minimum !== '2.0.0') process.exit(1);
          NODE

      - name: Verify feature flags fail closed on payment readiness without integration secrets
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --output /tmp/feature-flags.json --dump-header /tmp/feature-flags-headers.txt --write-out '%{http_code}' \
            "$TITAN_PREVIEW_URL/api/functions/featureFlags")"
          test "$STATUS" = "200" || { cat /tmp/feature-flags.json; echo "Native featureFlags returned HTTP $STATUS"; exit 1; }
          grep -qi '^x-titanos-api-runtime:.*cloudflare-workers-native' /tmp/feature-flags-headers.txt
          grep -qi '^cache-control:.*no-store' /tmp/feature-flags-headers.txt
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('/tmp/feature-flags.json', 'utf8'));
          if (!d.flags || !d.launch) process.exit(1);
          if (d.launch.membershipPaymentsLive !== false) process.exit(1);
          if (d.launch.verified !== false || d.launch.source !== 'safe_fallback') process.exit(1);
          NODE

      - name: Verify native authentication boundary fails closed without secrets
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --output /tmp/auth-me.json --dump-header /tmp/auth-me-headers.txt --write-out '%{http_code}' \
            "$TITAN_PREVIEW_URL/api/functions/auth/me")"
          test "$STATUS" = "401" || { cat /tmp/auth-me.json; echo "No-auth request did not remain fail-closed on Workers: HTTP $STATUS"; exit 1; }
          grep -qi '^x-titanos-api-runtime:.*cloudflare-workers-native' /tmp/auth-me-headers.txt
          grep -qi '^cache-control:.*no-store' /tmp/auth-me-headers.txt

      - name: Verify registration candidate rejects without mutation
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --output /tmp/register.json --dump-header /tmp/register-headers.txt --write-out '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            --data '{"email":"not-an-email","password":"validlength"}' \
            "$TITAN_PREVIEW_URL/api/register")"
          test "$STATUS" = "400" || { cat /tmp/register.json; echo "Registration validation returned HTTP $STATUS"; exit 1; }
          grep -qi '^x-titanos-api-runtime:.*cloudflare-workers-native' /tmp/register-headers.txt
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('/tmp/register.json', 'utf8'));
          if (d.error !== 'Valid email is required') process.exit(1);
          NODE

          ALIAS_STATUS="$(curl --silent --show-error --output /tmp/register-alias.json --write-out '%{http_code}' \
            "$TITAN_PREVIEW_URL/api/functions/auth/register")"
          test "$ALIAS_STATUS" = "405" || { cat /tmp/register-alias.json; echo "Registration alias method guard returned HTTP $ALIAS_STATUS"; exit 1; }

      - name: Verify TitanAI capabilities contract runs natively without provider access
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --output /tmp/titanai-capabilities.json --dump-header /tmp/titanai-capabilities-headers.txt --write-out '%{http_code}' \
            "$TITAN_PREVIEW_URL/api/functions/titanAICapabilities")"
          test "$STATUS" = "200" || { cat /tmp/titanai-capabilities.json; echo "TitanAI capabilities returned HTTP $STATUS"; exit 1; }
          grep -qi '^x-titanos-api-runtime:.*cloudflare-workers-native' /tmp/titanai-capabilities-headers.txt
          grep -qi '^cache-control:.*no-store' /tmp/titanai-capabilities-headers.txt
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('/tmp/titanai-capabilities.json', 'utf8'));
          if (d.service !== 'Titan AI' || d.platform !== 'TitanOS' || d.version !== 1) process.exit(1);
          if (d.endpoints?.titanAICapabilities?.method !== 'GET') process.exit(1);
          if (d.endpoints?.titanAICapabilities?.path !== '/api/functions/titanAICapabilities') process.exit(1);
          if (d.endpoints?.titanAICapabilities?.authRequired !== false) process.exit(1);
          if (d.endpoints?.titanAI?.authRequired !== true) process.exit(1);
          if (d.endpoints?.aiExecuteAction?.authRequired !== true) process.exit(1);
          if (!Array.isArray(d.supportedIntents) || d.supportedIntents.length === 0) process.exit(1);
          NODE

          POST_STATUS="$(curl --silent --show-error --output /tmp/titanai-capabilities-post.json --write-out '%{http_code}' \
            -X POST "$TITAN_PREVIEW_URL/api/functions/titanAICapabilities")"
          test "$POST_STATUS" = "405" || { cat /tmp/titanai-capabilities-post.json; echo "TitanAI capabilities mutating-method guard returned HTTP $POST_STATUS"; exit 1; }

          HEAD_STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -I "$TITAN_PREVIEW_URL/api/functions/titanAICapabilities")"
          test "$HEAD_STATUS" = "200" || { echo "TitanAI capabilities HEAD returned HTTP $HEAD_STATUS"; exit 1; }

      - name: Verify retired Sentry debug route remains fail closed
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --output /tmp/retired-sentry-debug.json --dump-header /tmp/retired-sentry-debug-headers.txt --write-out '%{http_code}' \
            "$TITAN_PREVIEW_URL/api/functions/sentryDebug")"
          test "$STATUS" = "503" || { cat /tmp/retired-sentry-debug.json; echo "Retired Sentry debug route returned HTTP $STATUS"; exit 1; }
          grep -qi '^x-titanos-api-runtime:.*cloudflare-workers-native' /tmp/retired-sentry-debug-headers.txt
          grep -qi '^cache-control:.*no-store' /tmp/retired-sentry-debug-headers.txt
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('/tmp/retired-sentry-debug.json', 'utf8'));
          if (d.error !== 'api_route_not_migrated') process.exit(1);
          NODE

      - name: Verify unported API routes fail closed visibly
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --output /tmp/unported.json --dump-header /tmp/unported-headers.txt --write-out '%{http_code}' \
            "$TITAN_PREVIEW_URL/api/functions/titanAI")"
          test "$STATUS" = "503" || { cat /tmp/unported.json; echo "Unported API route did not fail closed: HTTP $STATUS"; exit 1; }
          grep -qi '^x-titanos-api-runtime:.*cloudflare-workers-native' /tmp/unported-headers.txt
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('/tmp/unported.json', 'utf8'));
          if (d.error !== 'api_route_not_migrated') process.exit(1);
          NODE

      - name: Assert preview cannot become production routing
        shell: bash
        run: |
          set -euo pipefail
          if grep -n -E '"workers_dev"[[:space:]]*:[[:space:]]*false|"routes?"[[:space:]]*:|"custom_domains?"[[:space:]]*:' wrangler.jsonc; then
            echo "Production route/domain configuration detected in Wrangler config"
            exit 1
          fi

          WORKFLOW=.github/workflows/cloudflare-full-preview.yml
          ROUTE_OPT="--rou""te"
          ROUTES_OPT="--rou""tes"
          DOMAIN_OPT="--dom""ain"
          if grep -n -E -- "${ROUTE_OPT}|${ROUTES_OPT}|${DOMAIN_OPT}" "$WORKFLOW"; then
            echo "Preview workflow attempts to attach production routing"
            exit 1
          fi
