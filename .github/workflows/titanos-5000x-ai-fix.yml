name: TitanOS 5000X AI hardening

on:
  push:
    branches:
      - security/titanos-5000x-full-system-audit
    paths:
      - .github/workflows/titanos-5000x-ai-fix.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/titanos-5000x-full-system-audit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply Titan + Invisible Interface hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          titan = Path('api/functions/titanAI.js')
          text = titan.read_text()

          old = 'import { isOwnerEmail } from "../../shared/entitlements.js";'
          new = 'import { buildInvisibleInterface, buildConfirmationInterface } from "../_lib/invisibleInterface.js";'
          if old not in text:
              raise SystemExit('Expected owner import not found; refusing unsafe patch')
          text = text.replace(old, new, 1)

          text = text.replace('      ownerAutopilot = false,\n', '', 1)
          owner_line = '    const ownerMode = Boolean(ownerAutopilot) && isOwnerEmail(userData.user.email || "");\n'
          if owner_line not in text:
              raise SystemExit('Expected ownerMode line not found')
          text = text.replace(owner_line, '', 1)

          pattern = re.compile(r'''\n      if \(ownerMode && \(confirm\.intent === "run_workflow" \|\| isAllowedAiIntent\(confirm\.intent\)\)\) \{.*?\n      \}\n      return res\.status\(200\)\.json\(\{ data: confirm \}\);''', re.S)
          replacement = '''\n      return res.status(200).json({\n        data: {\n          ...confirm,\n          interface: buildConfirmationInterface(confirm),\n        },\n      });'''
          text2, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Owner-autopilot block replacement count={count}')
          text = text2

          # Attach safe, deterministic Invisible Interface specs to every normal Titan response.
          text = text.replace(
              '          generalKnowledge: false,\n',
              '          generalKnowledge: false,\n          interface: buildInvisibleInterface({ question: lastMessage, summary, pageContext }),\n'
          )
          text = text.replace(
              '        generalKnowledge: true,\n',
              '        generalKnowledge: true,\n        interface: buildInvisibleInterface({ question: lastMessage, summary, pageContext }),\n'
          )

          if 'ownerMode && (confirm.intent' in text or 'owner_autopilot_execute' in text:
              raise SystemExit('Owner autopilot execution bypass still present')
          if 'buildConfirmationInterface(confirm)' not in text:
              raise SystemExit('Confirmation interface not wired')
          if 'buildInvisibleInterface({ question: lastMessage, summary, pageContext })' not in text:
              raise SystemExit('Response interface not wired')

          titan.write_text(text)

          ui = Path('src/pages/AIAssistant.jsx')
          u = ui.read_text()
          u = u.replace(
              'import { useSearchParams } from "react-router";',
              'import { useNavigate, useSearchParams } from "react-router";',
              1,
          )
          marker = 'import ConfirmationCard from "@/components/ai/ConfirmationCard";'
          if marker not in u:
              raise SystemExit('AIAssistant import marker not found')
          u = u.replace(marker, marker + '\nimport InvisibleInterface from "@/components/ai/InvisibleInterface";', 1)
          u = u.replace(
              '  const { user } = useAuth();\n',
              '  const { user } = useAuth();\n  const navigate = useNavigate();\n',
              1,
          )

          # Preserve the text response while attaching the server-validated UI spec.
          target = '          generalKnowledge: data.generalKnowledge,\n'
          if target not in u:
              raise SystemExit('Response message target not found')
          u = u.replace(target, target + '          interface: data.interface || null,\n', 1)

          target = '          meta: {\n            intent: data.intent,'
          if target not in u:
              raise SystemExit('Confirm message target not found')
          u = u.replace(target, '          interface: data.interface || null,\n          meta: {\n            intent: data.intent,', 1)

          # Render the same safe server spec beside confirmation and response messages.
          old_confirm = '''          <ConfirmationCard\n            summary={msg.meta.summary}\n            details={msg.meta.details}\n            onConfirm={() => handleConfirm(i)}\n            onCancel={() => handleCancel(i)}\n            loading={confirming}\n          />'''
          new_confirm = '''          <div className="space-y-2 w-full max-w-2xl">\n            <InvisibleInterface spec={msg.interface} onNavigate={navigate} onPrompt={sendMessage} />\n            <ConfirmationCard\n              summary={msg.meta.summary}\n              details={msg.meta.details}\n              onConfirm={() => handleConfirm(i)}\n              onCancel={() => handleCancel(i)}\n              loading={confirming}\n            />\n          </div>'''
          if old_confirm not in u:
              raise SystemExit('ConfirmationCard render block not found')
          u = u.replace(old_confirm, new_confirm, 1)

          markdown_marker = '''          <ReactMarkdown\n            className="text-sm prose prose-sm dark:prose-invert max-w-none [&_p]:text-foreground [&_li]:text-foreground [&_strong]:text-foreground [&_p]:my-1 [&_ul]:my-1 [&_ol]:my-1 [&_li]:my-0.5"'''
          if markdown_marker not in u:
              raise SystemExit('Markdown render marker not found')
          u = u.replace(
              markdown_marker,
              '          <InvisibleInterface spec={msg.interface} onNavigate={navigate} onPrompt={sendMessage} />\n' + markdown_marker,
              1,
          )

          ui.write_text(u)

          test = Path('scripts/titan-5000x-ai-integration.test.mjs')
          test.write_text('''import fs from "node:fs";\nimport assert from "node:assert/strict";\n\nconst server = fs.readFileSync("api/functions/titanAI.js", "utf8");\nconst client = fs.readFileSync("src/pages/AIAssistant.jsx", "utf8");\n\nassert(!server.includes("owner_autopilot_execute"), "owner autopilot execution bypass must be removed");\nassert(!server.includes("ownerMode && (confirm.intent"), "owner mode must not bypass confirmation");\nassert(server.includes("buildConfirmationInterface(confirm)"), "confirmation UI must come from server builder");\nassert(server.includes("buildInvisibleInterface({ question: lastMessage, summary, pageContext })"), "normal Titan responses must include safe Invisible Interface specs");\nassert(client.includes("InvisibleInterface spec={msg.interface}"), "assistant must render Invisible Interface specs");\nassert(client.includes("interface: data.interface || null"), "assistant must retain server interface specs");\nconsole.log("Titan 5000X AI integration assertions passed");\n''')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Security and AI gates
        run: |
          node scripts/titan-5000x-ai-integration.test.mjs
          npm run test:security
          npm run test:ai
          npm run typecheck
          npm run build

      - name: Commit verified hardening and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/titanos-5000x-ai-fix.yml
          git config user.name "TitanOS Release Guardian"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "security: merge Invisible Interface into Titan trust boundary"
          git push origin HEAD:security/titanos-5000x-full-system-audit
