name: Fix 2nd Me correlation runtime
on:
  push:
    branches: [hardening/second-me-correlation-history]
    paths:
      - scripts/fix-correlation-runtime.mjs
      - .github/workflows/fix-correlation-runtime.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fix-correlation-runtime.mjs
      - run: rm -f scripts/fix-correlation-runtime.mjs .github/workflows/fix-correlation-runtime.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ai): preserve correlation through result and retry"
          git push
