name: TitanOS Cloudflare Preview Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - "infra/cloudflare-workers-migration"
    paths:
      - "cloudflare/preview-trigger.txt"

permissions:
  contents: read

concurrency:
  group: titanos-cloudflare-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/infra/cloudflare-workers-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TITAN_STRIPE_WEBHOOK_ID: we_1U4TMOEfgMoCUJrZYAwGUp2o
      TITAN_PREVIEW_URL: https://titanos-preview.blahtblclthpt99.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify required deployment credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          test -n "$STRIPE_SECRET_KEY" || { echo "Missing STRIPE_SECRET_KEY repository secret"; exit 1; }
          test -n "$STRIPE_WEBHOOK_SECRET" || { echo "Missing STRIPE_WEBHOOK_SECRET repository secret"; exit 1; }
          test -n "$SUPABASE_URL" || { echo "Missing SUPABASE_URL repository secret"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "Missing SUPABASE_SERVICE_ROLE_KEY repository secret"; exit 1; }

      - name: Verify Titan Stripe account and Supabase service role
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -u "$STRIPE_SECRET_KEY:" https://api.stripe.com/v1/account > /tmp/stripe-account.json
          node - <<'NODE'
          const fs = require('fs');
          const account = JSON.parse(fs.readFileSync('/tmp/stripe-account.json', 'utf8'));
          if (account?.id !== 'acct_1Tzwq3EfgMoCUJrZ') throw new Error(`Unexpected Stripe account: ${account?.id || 'missing'}`);
          if (!account.charges_enabled) throw new Error('Titan Stripe account cannot accept charges');
          console.log(`Titan Stripe account verified: ${account.id}`);
          NODE
          rm -f /tmp/stripe-account.json

          SUPABASE_BASE="${SUPABASE_URL%/}"
          SUPABASE_BASE="${SUPABASE_BASE%/rest/v1}"
          SUPABASE_BASE="${SUPABASE_BASE%/auth/v1}"
          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_BASE/rest/v1/attention_profiles?select=user_id&limit=0" > /tmp/supabase-check.json
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/supabase-check.json','utf8'));if(!Array.isArray(d))process.exit(1);"
          rm -f /tmp/supabase-check.json

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Reject legacy runtime references
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'LEGACY_API_ORIGIN|titanos-web\.vercel\.app' cloudflare wrangler.jsonc; then
            echo "Legacy Vercel runtime reference detected in Cloudflare deployment surface"
            exit 1
          fi

      - name: Validate Cloudflare bundle before upload
        run: npx --yes wrangler@4.102.0 deploy --dry-run --outdir .wrangler-preview-dry-run

      - name: Provision preview Worker payment secrets
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const names = ['STRIPE_SECRET_KEY','STRIPE_WEBHOOK_SECRET','SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY'];
          fs.writeFileSync('/tmp/titanos-preview-secrets.json', JSON.stringify(Object.fromEntries(names.map((name) => [name, process.env[name]]))));
          NODE
          npx --yes wrangler@4.102.0 secret bulk /tmp/titanos-preview-secrets.json --name titanos-preview
          rm -f /tmp/titanos-preview-secrets.json

      - name: Deploy isolated Cloudflare preview worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.102.0'
          command: deploy --name titanos-preview

      - name: Smoke-test deployed Cloudflare-native edge runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 4 --retry-delay 3 --retry-all-errors "$TITAN_PREVIEW_URL/__titanos/edge-health" | tee /tmp/titanos-edge-health.json
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/titanos-edge-health.json','utf8'));if(d.ok!==true||d.runtime!=='cloudflare-workers'||d.api_runtime!=='cloudflare-workers'||d.legacy_proxy!==false||d.payment_bindings_configured!==true)process.exit(1);"

      - name: Smoke-test retired API paths fail closed
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --output /tmp/retired-api.json --write-out '%{http_code}' "$TITAN_PREVIEW_URL/api/retired-probe")"
          test "$STATUS" = "404" || { cat /tmp/retired-api.json; echo "Retired API path did not fail closed"; exit 1; }

      - name: Verify signed Cloudflare webhook handling without financial mutation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const timestamp = Math.floor(Date.now() / 1000);
          const payload = JSON.stringify({
            id: `evt_titan_cloudflare_probe_${timestamp}`,
            object: 'event',
            type: 'customer.created',
            data: { object: { id: 'cus_titan_probe', object: 'customer' } },
          });
          const digest = crypto.createHmac('sha256', process.env.STRIPE_WEBHOOK_SECRET).update(`${timestamp}.${payload}`).digest('hex');
          fs.writeFileSync('/tmp/titan-webhook-probe.json', payload);
          fs.writeFileSync('/tmp/titan-webhook-signature.txt', `t=${timestamp},v1=${digest}`);
          NODE
          SIGNATURE="$(cat /tmp/titan-webhook-signature.txt)"
          STATUS="$(curl --silent --show-error --output /tmp/titan-webhook-response.json --write-out '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            -H "Stripe-Signature: $SIGNATURE" \
            --data-binary @/tmp/titan-webhook-probe.json \
            "$TITAN_PREVIEW_URL/api/functions/stripeWebhook")"
          test "$STATUS" = "200" || { cat /tmp/titan-webhook-response.json; echo "Signed webhook probe failed"; exit 1; }
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/titan-webhook-response.json','utf8'));if(d.received!==true||d.ignored!==true)process.exit(1);"
          rm -f /tmp/titan-webhook-probe.json /tmp/titan-webhook-signature.txt /tmp/titan-webhook-response.json

      - name: Retarget active Titan Stripe webhook to Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$TITAN_PREVIEW_URL/api/functions/stripeWebhook"
          OLD='https://titanos-web.vercel.app/api/functions/stripeWebhook'
          curl --fail --silent --show-error -u "$STRIPE_SECRET_KEY:" "https://api.stripe.com/v1/webhook_endpoints/$TITAN_STRIPE_WEBHOOK_ID" > /tmp/titan-hook-before.json
          node - <<'NODE'
          const fs = require('fs');
          const hook = JSON.parse(fs.readFileSync('/tmp/titan-hook-before.json','utf8'));
          const allowed = new Set(['https://titanos-web.vercel.app/api/functions/stripeWebhook','https://titanos-preview.blahtblclthpt99.workers.dev/api/functions/stripeWebhook']);
          if (hook?.id !== process.env.TITAN_STRIPE_WEBHOOK_ID || hook?.status !== 'enabled' || !allowed.has(hook?.url)) {
            throw new Error(`Unsafe webhook precondition: ${hook?.id || 'missing'} ${hook?.status || 'missing'} ${hook?.url || 'missing'}`);
          }
          console.log(`Webhook precondition verified: ${hook.url}`);
          NODE

          curl --fail --silent --show-error -u "$STRIPE_SECRET_KEY:" \
            -X POST "https://api.stripe.com/v1/webhook_endpoints/$TITAN_STRIPE_WEBHOOK_ID" \
            --data-urlencode "url=$TARGET" \
            --data-urlencode 'enabled_events[]=checkout.session.completed' \
            --data-urlencode 'enabled_events[]=checkout.session.async_payment_succeeded' \
            --data-urlencode 'enabled_events[]=checkout.session.expired' \
            --data-urlencode 'enabled_events[]=charge.refunded' \
            --data-urlencode 'enabled_events[]=payment_intent.canceled' > /tmp/titan-hook-after.json

          node - <<'NODE'
          const fs = require('fs');
          const hook = JSON.parse(fs.readFileSync('/tmp/titan-hook-after.json','utf8'));
          const expectedUrl = 'https://titanos-preview.blahtblclthpt99.workers.dev/api/functions/stripeWebhook';
          const expectedEvents = ['charge.refunded','checkout.session.async_payment_succeeded','checkout.session.completed','checkout.session.expired','payment_intent.canceled'].sort();
          const actualEvents = [...(hook.enabled_events || [])].sort();
          if (hook?.id !== process.env.TITAN_STRIPE_WEBHOOK_ID || hook?.status !== 'enabled' || hook?.url !== expectedUrl) throw new Error('Stripe webhook retarget verification failed');
          if (JSON.stringify(actualEvents) !== JSON.stringify(expectedEvents)) throw new Error(`Unexpected enabled events: ${actualEvents.join(',')}`);
          console.log(`Titan Stripe webhook migrated: ${hook.id} -> ${hook.url}`);
          console.log(`Enabled events: ${actualEvents.join(',')}`);
          NODE
          rm -f /tmp/titan-hook-before.json /tmp/titan-hook-after.json
