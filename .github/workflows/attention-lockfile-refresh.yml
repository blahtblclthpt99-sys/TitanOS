name: Titan Attention Lockfile Refresh

on:
  push:
    branches:
      - infra/cloudflare-workers-migration
    paths:
      - package.json
      - .github/workflows/attention-lockfile-refresh.yml

permissions:
  contents: write

concurrency:
  group: titan-attention-lockfile-refresh
  cancel-in-progress: false

jobs:
  refresh-lockfile:
    if: github.ref == 'refs/heads/infra/cloudflare-workers-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify active Attention policies
        run: npm test
      - name: Build production assets
        run: npm run build
      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize minimal Attention lockfile"
          git push origin HEAD:infra/cloudflare-workers-migration
