name: Apply workflow atomicity patch

on:
  push:
    branches: [hardening/second-me-workflow-atomicity]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/second-me-workflow-atomicity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply source patch
        run: node scripts/apply-workflow-atomicity-patch.mjs
      - name: Remove one-time patch machinery
        run: git rm .github/workflows/apply-workflow-atomicity.yml scripts/apply-workflow-atomicity-patch.mjs
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/functions/titanAI.js package.json api/_lib/compensatingWorkflow.js scripts/compensating-workflow.test.mjs
          git commit -m "harden(ai): make multi-step workflows compensating-atomic"
          git push origin HEAD:hardening/second-me-workflow-atomicity
