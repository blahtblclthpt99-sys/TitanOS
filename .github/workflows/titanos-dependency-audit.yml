name: TitanOS dependency remediation

on:
  push:
    branches:
      - security/titanos-5000x-dependency-audit
    paths:
      - .github/workflows/titanos-dependency-audit.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/titanos-5000x-dependency-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply non-breaking audit fixes
        run: npm audit fix --package-lock-only
      - name: Reinstall exact remediated graph
        run: npm ci
      - name: Reject remaining high/critical advisories
        run: npm audit --audit-level=high
      - name: Full ship gate
        run: npm run gate:ship
      - name: Commit verified dependency remediation and remove workflow
        run: |
          rm .github/workflows/titanos-dependency-audit.yml
          git config user.name "TitanOS Release Guardian"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json package.json .github/workflows/titanos-dependency-audit.yml
          git diff --cached --check
          git commit -m "security: remediate high-severity transitive dependencies"
          git push origin HEAD:security/titanos-5000x-dependency-audit
