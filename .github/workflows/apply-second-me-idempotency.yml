name: Apply 2nd Me idempotency patch
on:
  push:
    branches:
      - hardening/second-me-idempotency
    paths:
      - scripts/apply-second-me-idempotency.mjs
      - .github/workflows/apply-second-me-idempotency.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/second-me-idempotency
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply source patch
        run: node scripts/apply-second-me-idempotency.mjs
      - name: Remove one-time patch machinery
        run: |
          rm scripts/apply-second-me-idempotency.mjs
          rm .github/workflows/apply-second-me-idempotency.yml
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "harden(ai): make confirmed writes idempotent"
          git push origin HEAD:hardening/second-me-idempotency
