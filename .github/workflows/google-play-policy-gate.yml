name: Google Play Policy Gate

on:
  pull_request:
  push:
    branches:
      - titanos-career-core-google-policy

permissions:
  contents: read

jobs:
  policy-gate:
    name: Career-core policy gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Android policy surface
        run: node scripts/google-play-policy-gate.mjs

      - name: Validate job matching policy
        run: node --test scripts/job-match.test.mjs
