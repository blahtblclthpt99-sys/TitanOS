name: TitanOS Android Release Bundle

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/android-release.yml
      - android/**
      - src/**
      - public/**
      - index.html
      - capacitor.config.*
      - vite.config.*
      - postcss.config.*
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Install dependencies
        run: npm ci

      - name: Verify release metadata
        run: |
          grep -q 'versionCode 34' android/app/build.gradle
          grep -q 'versionName "2.0.1"' android/app/build.gradle
          grep -q 'applicationId "com.titanos.myapp"' android/app/build.gradle

      - name: Restore existing Play upload key when configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/titanos-upload.jks
            cat > android/keystore.properties <<EOF
          storeFile=titanos-upload.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
            echo "PLAY_SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"
          else
            echo "PLAY_SIGNING_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "Existing Play upload-key secrets are not configured; bundle will be unsigned."
          fi

      - name: Build and sync Capacitor
        run: npm run cap:sync

      - name: Build release AAB
        working-directory: android
        run: gradle bundleRelease --no-daemon

      - name: Verify bundle and signing state
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          sha256sum "$AAB" | tee aab-sha256.txt
          if jarsigner -verify "$AAB" >/dev/null 2>&1; then
            echo "AAB_SIGNED=true" | tee -a aab-build-info.txt
          else
            echo "AAB_SIGNED=false" | tee -a aab-build-info.txt
          fi
          echo "PLAY_SIGNING_CONFIGURED=$PLAY_SIGNING_CONFIGURED" | tee -a aab-build-info.txt
          echo "VERSION_NAME=2.0.1" | tee -a aab-build-info.txt
          echo "VERSION_CODE=34" | tee -a aab-build-info.txt
          echo "APPLICATION_ID=com.titanos.myapp" | tee -a aab-build-info.txt

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: TitanOS-2.0.1-code34-AAB
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            aab-sha256.txt
            aab-build-info.txt
          if-no-files-found: error
          retention-days: 30
