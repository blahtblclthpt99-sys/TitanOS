name: TitanOS Cloudflare Account Audit

on:
  workflow_dispatch:
  push:
    branches:
      - "infra/cloudflare-workers-migration"
    paths:
      - ".github/workflows/cloudflare-account-audit.yml"
      - "cloudflare/account-audit-trigger.txt"

permissions:
  contents: read

jobs:
  audit-cloudflare:
    if: github.ref == 'refs/heads/infra/cloudflare-workers-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API: https://api.cloudflare.com/client/v4
    steps:
      - uses: actions/checkout@v4

      - name: Verify read-only audit boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          if grep -n -E 'curl .* (-X|--request) (POST|PUT|PATCH|DELETE)|wrangler@[^ ]+ (deploy([[:space:]]|$)|secret (put|bulk|delete)([[:space:]]|$)|versions (deploy|upload)([[:space:]]|$)|triggers deploy([[:space:]]|$))' .github/workflows/cloudflare-account-audit.yml; then
            echo "Audit workflow contains a mutation command"
            exit 1
          fi

      - name: Inventory Workers account routing
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl --fail --silent --show-error -H "$AUTH" "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" > /tmp/account-subdomain.json
          curl --fail --silent --show-error -H "$AUTH" "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" > /tmp/scripts.json
          curl --fail --silent --show-error -H "$AUTH" "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" > /tmp/domains.json
          node <<'NODE'
          const fs = require('fs');
          const sub = JSON.parse(fs.readFileSync('/tmp/account-subdomain.json','utf8'));
          const scripts = JSON.parse(fs.readFileSync('/tmp/scripts.json','utf8'));
          const domains = JSON.parse(fs.readFileSync('/tmp/domains.json','utf8'));
          if (!sub.success || !scripts.success || !domains.success) process.exit(1);
          console.log(`Workers account subdomain: ${sub.result?.subdomain || '(unknown)'}`);
          console.log(`Worker scripts: ${(scripts.result || []).map(x => x.id).filter(Boolean).sort().join(', ') || '(none)'}`);
          const rows = (domains.result || []).map(x => `${x.hostname} -> ${x.service}`).sort();
          console.log(`Custom Worker domains: ${rows.join(', ') || '(none)'}`);
          NODE

      - name: Inspect Titan Worker subdomain exposure
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          for worker in titanos-preview titanos-ci-preview titanos-full-ci-preview; do
            curl --fail --silent --show-error -H "$AUTH" "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker/subdomain" > "/tmp/$worker-subdomain.json"
            WORKER="$worker" node <<'NODE'
          const fs = require('fs');
          const worker = process.env.WORKER;
          const d = JSON.parse(fs.readFileSync(`/tmp/${worker}-subdomain.json`, 'utf8'));
          if (!d.success) process.exit(1);
          console.log(`${worker}: workers.dev enabled=${d.result?.enabled === true}, previews_enabled=${d.result?.previews_enabled === true}`);
          NODE
          done

      - name: Inspect reserved titanos-preview deployment and secret names
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.102.0 deployments status --name titanos-preview --json > /tmp/titanos-preview-deployment.json
          npx --yes wrangler@4.102.0 secret list --name titanos-preview --format json > /tmp/titanos-preview-secrets.json
          node <<'NODE'
          const fs = require('fs');
          const deployment = JSON.parse(fs.readFileSync('/tmp/titanos-preview-deployment.json','utf8'));
          const secretData = JSON.parse(fs.readFileSync('/tmp/titanos-preview-secrets.json','utf8'));
          const entries = Array.isArray(secretData) ? secretData : (secretData?.secrets || []);
          const names = entries.map(x => x?.name).filter(Boolean).sort();
          console.log(`titanos-preview deployment metadata present=${Boolean(deployment)}`);
          console.log(`titanos-preview secret names: ${names.join(', ') || '(none)'}`);
          NODE

      - name: Probe reserved titanos-preview edge without mutation
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://titanos-preview.blahtblclthpt99.workers.dev"
          STATUS="$(curl --silent --show-error --output /tmp/preview-health.json --write-out '%{http_code}' "$BASE/__titanos/edge-health")"
          echo "titanos-preview edge-health HTTP status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            node <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('/tmp/preview-health.json','utf8'));
          const safe = {
            ok: d.ok,
            service: d.service,
            runtime: d.runtime,
            api_runtime: d.api_runtime,
            legacy_proxy: d.legacy_proxy,
            app_origin_configured: d.app_origin_configured,
            payment_bindings_configured: d.payment_bindings_configured,
          };
          console.log(`titanos-preview health: ${JSON.stringify(safe)}`);
          NODE
          else
            cat /tmp/preview-health.json || true
          fi
