name: TitanOS Product Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: titanos-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_APP_SURFACE: "titanos"
      VITE_SUPABASE_URL: "https://wbymywwrpbljfbsemung.supabase.co"
      VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_RzUfaeZN5WU58Ma-a5iJNw_fPEC25cI"
      VITE_API_BASE_URL: "https://titanos-web.vercel.app"
      VITE_TITANOS_PUBLIC_ORIGIN: "https://titanos-web.vercel.app"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high
      - name: Production ship gate
        run: npm run gate:ship
