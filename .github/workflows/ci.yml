# TitanOS CI — build gate for GitHub → Vercel continuous deployment
name: CI

on:
  push:
    branches: [main, master, titanos-career-core-google-policy]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit / integration / regression pack
        run: npm test

      - name: Career core regression pack
        run: >-
          node --test
          scripts/career-attention.test.mjs
          scripts/career-pipeline.test.mjs
          scripts/career-preference-storage.test.mjs
          scripts/career-readiness.test.mjs
          scripts/employer-intelligence.test.mjs
          scripts/job-match-career-core.test.mjs
          scripts/job-search-command.test.mjs
          scripts/resume-builder.test.mjs

      - name: Private Storage URL safety
        run: node --test scripts/storage-url-security.test.mjs

      - name: Existing-post worker matching regression
        run: node --import ./scripts/node-test-setup.mjs --test-force-exit --test scripts/hire-existing-post-matches.test.mjs

      - name: Free job access contract
        run: node --test scripts/free-job-access.test.mjs

      - name: Google Play billing policy boundary
        run: node --test scripts/play-billing-policy.test.mjs

      - name: Google Play account deletion policy boundary
        run: node --test scripts/account-deletion-policy.test.mjs

      - name: Google Play UGC safety policy boundary
        run: node --test scripts/play-ugc-safety-policy.test.mjs

      - name: Admin Control Center session recovery
        run: node --test scripts/admin-control-session.test.mjs

      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: public-anon-placeholder-for-ci
          VITE_TITANOS_PUBLIC_ORIGIN: https://titanos-web.vercel.app
          VITE_API_BASE_URL: https://titanos-web.vercel.app

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke (Chromium)
        run: npm run test:e2e
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: public-anon-placeholder-for-ci
          VITE_TITANOS_PUBLIC_ORIGIN: https://titanos-web.vercel.app
          VITE_API_BASE_URL: https://titanos-web.vercel.app
