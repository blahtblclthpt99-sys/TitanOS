# TitanOS CI — application and Android build gate
name: CI

on:
  push:
    branches: [main, master, product/titan-core-four]
  pull_request:
    branches: [main, master, product/titan-core-four]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit / integration / regression pack
        run: npm test

      - name: Titan Support security and workspace boundary
        run: node --test scripts/support-security.test.mjs

      - name: Titan Support case-creation recovery
        run: node --test scripts/support-create-case-recovery.test.mjs

      - name: Database recovery preflight classification
        run: node --test scripts/db-recovery-preflight.test.mjs

      - name: Business OS product boundary
        run: node --test scripts/business-os-product.test.mjs

      - name: Engagement and recruiting boundary
        run: node --test scripts/engagement-boundary.test.mjs

      - name: Ad monetization safety
        run: node --test scripts/ad-monetization.test.mjs

      - name: Private Storage URL safety
        run: node --test scripts/storage-url-security.test.mjs

      - name: Existing-post worker matching regression
        run: node --import ./scripts/node-test-setup.mjs --test-force-exit --test scripts/hire-existing-post-matches.test.mjs

      - name: Free job access contract
        run: node --test scripts/free-job-access.test.mjs

      - name: Find Jobs session recovery
        run: node --test scripts/job-match-session-recovery.test.mjs

      - name: Android native auth routing
        run: node --test scripts/android-auth-routing.test.mjs

      - name: Google Play billing policy boundary
        run: node --test scripts/play-billing-policy.test.mjs

      - name: Google Play account deletion policy boundary
        run: node --test scripts/account-deletion-policy.test.mjs

      - name: Google Play UGC safety policy boundary
        run: node --test scripts/play-ugc-safety-policy.test.mjs

      - name: Admin Control Center session recovery
        run: node --test scripts/admin-control-session.test.mjs

      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: public-anon-placeholder-for-ci
          VITE_TITANOS_PUBLIC_ORIGIN: https://titanos-web.vercel.app
          VITE_API_BASE_URL: https://titanos-web.vercel.app

      - name: Setup Java for Android
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Normalize Gradle wrapper permissions
        run: chmod +x android/gradlew

      - name: Compile Android debug app
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify Android debug artifact
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke (Chromium)
        run: npm run test:e2e
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: public-anon-placeholder-for-ci
          VITE_TITANOS_PUBLIC_ORIGIN: https://titanos-web.vercel.app
          VITE_API_BASE_URL: https://titanos-web.vercel.app
