name: TitanOS Cloudflare Full App Validate

on:
  pull_request:
    branches: [main]
    paths:
      - "cloudflare/**"
      - "src/**"
      - "api/**"
      - "public/**"
      - "scripts/**"
      - "supabase/**"
      - "ops/**"
      - "docs/CLOUDFLARE_API_MIGRATION_MATRIX.md"
      - "docs/DEPLOYMENT_CHECKLIST.md"
      - ".env.example"
      - "index.html"
      - "vite.config.js"
      - "wrangler.jsonc"
      - "vercel.json"
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - "infra/cloudflare-full-titanos-migration"
    paths:
      - "cloudflare/**"
      - "src/**"
      - "api/**"
      - "public/**"
      - "scripts/**"
      - "supabase/**"
      - "ops/**"
      - "docs/CLOUDFLARE_API_MIGRATION_MATRIX.md"
      - "docs/DEPLOYMENT_CHECKLIST.md"
      - ".env.example"
      - "index.html"
      - "vite.config.js"
      - "wrangler.jsonc"
      - "vercel.json"
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: titanos-cloudflare-full-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prove canonical TitanOS product surface is intact
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "src/components/ai/InvisibleInterface.jsx"
            "src/components/shared/TitanSupportButton.jsx"
            "src/components/driver/DriverShiftPanel.jsx"
            "src/api/apiClient.js"
            "src/api/apiOrigin.js"
            "api/functions/titanAI.js"
            "api/functions/titanAILive.js"
            "api/functions/titanAICapabilities.js"
            "api/functions/supportAI.js"
            "api/functions/stripeWebhook.js"
            "api/functions/createSubscriptionCheckout.js"
            "api/functions/health.js"
            "api/functions/auth/me.js"
            "api/functions/auth/profilePolicy.js"
            "api/functions/appVersion.js"
            "api/functions/featureFlags.js"
            "api/register.js"
            "api/instrument.mjs"
            "scripts/canonical-app-entry.test.mjs"
            "scripts/landing-positioning.test.mjs"
            "scripts/payment-readiness.test.mjs"
            "scripts/no-attention-commerce-residue.test.mjs"
            "scripts/database-destructive-migration-guard.test.mjs"
            "scripts/database-migration-fidelity.manifest.json"
            "scripts/database-migration-fidelity.test.mjs"
            "scripts/cloudflare-registration.test.mjs"
            "scripts/cloudflare-node-adapter.test.mjs"
            "scripts/cloudflare-titanai-capabilities.test.mjs"
            "scripts/cloudflare-app-version.test.mjs"
            "scripts/cloudflare-feature-flags.test.mjs"
            "scripts/founding-beta.test.mjs"
            "scripts/auth-profile-policy.test.mjs"
            "supabase/migrations/20260828033000_lock_profile_referral_company_context.sql"
            "supabase/migrations/20260828041500_platform_launch_integrity.sql"
            ".github/workflows/android-release.yml"
            "cloudflare/node-handler-adapter.js"
            "cloudflare/api-router.js"
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "Canonical TitanOS surface missing: $path"; exit 1; }
          done
          test ! -e api/functions/sentryDebug.js || { echo "Retired Sentry debug route was restored"; exit 1; }
          test ! -e api/attention || { echo "Titan Attention API surface was restored"; exit 1; }
          test ! -e vercel.json || { echo "Retired Vercel runtime config was restored"; exit 1; }
          test ! -e .github/workflows/attention-build.yml || { echo "Titan Attention takeover workflow was restored"; exit 1; }

      - name: Install dependencies exactly from lockfile
        run: npm ci

      - name: Canonical TitanOS application entrypoint suite
        run: node --test scripts/canonical-app-entry.test.mjs

      - name: TitanOS landing positioning suite
        run: node --test scripts/landing-positioning.test.mjs

      - name: Block destructive database takeover migrations
        run: node --test scripts/database-destructive-migration-guard.test.mjs

      - name: Verify authoritative migration fidelity
        run: node --test scripts/database-migration-fidelity.test.mjs

      - name: Retired Attention commerce residue suite
        run: node --test scripts/no-attention-commerce-residue.test.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Authentication regression suite
        run: npm run test:auth

      - name: Auth profile policy suite
        run: node --test scripts/auth-profile-policy.test.mjs

      - name: API regression suite
        run: npm run test:api

      - name: Cloudflare registration safety suite
        run: node --test scripts/cloudflare-registration.test.mjs

      - name: Cloudflare Node adapter parity suite
        run: node --test scripts/cloudflare-node-adapter.test.mjs

      - name: Cloudflare app version contract suite
        run: node --test scripts/cloudflare-app-version.test.mjs

      - name: Cloudflare feature flags integrity suite
        run: node --test scripts/cloudflare-feature-flags.test.mjs

      - name: Founding launch model and migration suite
        run: npm run test:founding

      - name: Payment readiness fail-closed suite
        run: node --import ./scripts/node-test-setup.mjs --test-force-exit --test scripts/payment-readiness.test.mjs

      - name: Cloudflare TitanAI capabilities contract suite
        run: node --test scripts/cloudflare-titanai-capabilities.test.mjs

      - name: Payment regression suite
        run: npm run test:payments

      - name: Security regression suite
        run: npm run test:security

      - name: TitanAI regression suite
        run: npm run test:ai

      - name: Driver Hub regression suite
        run: npm run test:driver

      - name: GPS regression suite
        run: npm run test:gps

      - name: Offline/PWA regression suite
        run: npm run test:offline

      - name: Build canonical production assets
        run: npm run build

      - name: Validate Cloudflare Worker bundle without deployment
        run: >-
          npx --yes wrangler@4.127.0 deploy --dry-run
          --outdir .wrangler-full-dry-run
          --var "TITANOS_ENV:preview"
          --var "APP_LATEST_VERSION:2.0.0"
          --var "APP_MINIMUM_VERSION:2.0.0"

      - name: Enforce staged native migration boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f cloudflare/worker.js
          test -f cloudflare/api-router.js
          test -f cloudflare/node-handler-adapter.js
          grep -q 'migration_mode: "full-app-native-staged"' cloudflare/worker.js
          grep -q 'api_runtime: "cloudflare-workers-native"' cloudflare/worker.js
          grep -q 'native_api_routes: 7' cloudflare/worker.js
          grep -q 'unmigrated_api_policy: "fail-closed"' cloudflare/worker.js
          grep -q 'production_cutover_ready: false' cloudflare/worker.js
          grep -q '"/api/functions/health"' cloudflare/api-router.js
          grep -q '"/api/functions/auth/me"' cloudflare/api-router.js
          grep -q '"/api/functions/appVersion"' cloudflare/api-router.js
          grep -q '"/api/functions/featureFlags"' cloudflare/api-router.js
          grep -q '"/api/functions/titanAICapabilities"' cloudflare/api-router.js
          grep -q '"/api/register"' cloudflare/api-router.js
          grep -q '"/api/functions/auth/register"' cloudflare/api-router.js
          ! grep -q 'sentryDebug' cloudflare/api-router.js
          ! grep -q 'createSubscriptionCheckout' cloudflare/api-router.js
          ! grep -Eq '^[[:space:]#]*SENTRY_DEBUG_ROUTE[[:space:]]*=' .env.example
          grep -q 'fault-injection endpoint is retired' ops/SENTRY_AND_RESEND.md
          grep -q 'retired /api/functions/sentryDebug' docs/DEPLOYMENT_CHECKLIST.md
          grep -q 'authorizeActiveCompanySelection' api/functions/auth/me.js
          grep -q 'normalizeLaunchRecord' api/functions/featureFlags.js
          grep -q 'membershipPaymentsLive: false' api/functions/featureFlags.js
          grep -q 'MEMBERSHIP_PAYMENTS_LIVE === "true"' api/_lib/stripeSubscriptions.js
          grep -q 'membershipPaymentsEnabled' api/functions/createSubscriptionCheckout.js
          grep -q 'pg_advisory_xact_lock(87231401)' supabase/migrations/20260828041500_platform_launch_integrity.sql
          grep -q 'founding_claimed BETWEEN 0 AND founding_cap' supabase/migrations/20260828041500_platform_launch_integrity.sql
          grep -q 'Referral attribution is server-managed' supabase/migrations/20260828033000_lock_profile_referral_company_context.sql
          grep -q 'Company access denied' supabase/migrations/20260828033000_lock_profile_referral_company_context.sql
          grep -q 'not_found_handling.*single-page-application' wrangler.jsonc
          grep -q '"/\*"' wrangler.jsonc
          grep -q '"!/assets/\*"' wrangler.jsonc

          if grep -R -n -E 'createRequire|@sentry/profiling-node' api/instrument.mjs; then
            echo "Node-native Sentry profiler/bootstrap leaked into Worker instrumentation"
            exit 1
          fi

          if grep -R -n -E 'LEGACY_API_ORIGIN|\.vercel\.app' cloudflare wrangler.jsonc .github/workflows/cloudflare-full-preview.yml; then
            echo "Cloudflare runtime still depends on a Vercel API origin"
            exit 1
          fi

          if grep -R -n -F 'titanos-web.vercel.app' \
            src/api \
            src/lib/auth-redirect.js \
            src/components/shared/AppUpdateGate.jsx \
            src/components/shared/OptimizedImage.jsx \
            api/_lib/cors.js \
            cloudflare \
            wrangler.jsonc; then
            echo "Retired TitanOS Vercel host is present in executable Cloudflare/browser runtime code"
            exit 1
          fi

          if grep -n -E '"workers_dev"[[:space:]]*:[[:space:]]*false|"routes?"[[:space:]]*:|"custom_domains?"[[:space:]]*:' wrangler.jsonc; then
            echo "Production routing must not be configured in Wrangler config"
            exit 1
          fi
