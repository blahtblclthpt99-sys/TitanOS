name: Apply Titan layout polish
on:
  push:
    branches: [hardening/second-me-correlation-history]
    paths:
      - scripts/apply-layout-polish.mjs
      - .github/workflows/apply-layout-polish.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply design-system patch
        run: node scripts/apply-layout-polish.mjs
      - name: Remove one-time patch machinery
        run: rm -f scripts/apply-layout-polish.mjs .github/workflows/apply-layout-polish.yml
      - name: Commit polished source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ui): adopt bento editorial spatial layout system"
          git push
