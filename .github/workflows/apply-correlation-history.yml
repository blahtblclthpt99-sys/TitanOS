name: Apply 2nd Me correlation history patch
on:
  push:
    branches: [hardening/second-me-correlation-history]
    paths:
      - scripts/apply-correlation-history-patch.mjs
      - .github/workflows/apply-correlation-history.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply source patch
        run: node scripts/apply-correlation-history-patch.mjs
      - name: Remove one-time patch machinery
        run: rm -f scripts/apply-correlation-history-patch.mjs .github/workflows/apply-correlation-history.yml
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ai): correlate actions and expose recent history"
          git push
